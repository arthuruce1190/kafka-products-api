spring.application.name=kafka-products-api
server.port=8080
# Configuración del topico a crear en kafka
spring.cloud.stream.bindings.commands-out-0.destination=products.command
# Configuración del tipo de contenido del tópico
spring.cloud.stream.bindings.commands-out-0.contentType=application/json
# Configuración del servidor de datos kafka
spring.cloud.kafka.binder.brokers=localhost:9092