spring.application.name=kafka-products-api
server.port=8080
# Configuración del topico a crear en kafka
spring.cloud.stream.bindings.commands-out-0.destination=products.commands
# Configuración del tipo de contenido del tópico
spring.cloud.stream.bindings.commands-out-0.contentType=application/json
spring.cloud.function.definition=handlerReplies
spring.cloud.stream.bindings.handlerReplies-in-0.destination=products.replies
spring.cloud.stream.bindings.handlerReplies-in-0.contentType=application/json
spring.cloud.stream.bindings.handlerReplies-in-0.group=products-api
spring.cloud.stream.kafka.bindings.handlerReplies-in-0.consumer.startOffset=latest
# Configuración del servidor de datos kafka
spring.cloud.kafka.binder.brokers=localhost:9092